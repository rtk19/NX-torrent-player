name: Build Switch release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Build and package NRO
        run: bash scripts/package-release.sh /tmp/nx-build
      - uses: actions/upload-artifact@v4
        with:
          name: NX-torrent-player
          path: |
            dist/*.nro
            dist/*.zip
            dist/SHA256SUMS
            dist/DejaVu-LICENSE.txt
      - name: Publish versioned update assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.nro
            dist/*.zip
            dist/SHA256SUMS
            dist/DejaVu-LICENSE.txt
          fail_on_unmatched_files: true
