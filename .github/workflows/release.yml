name: Build Switch release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install software OpenGL test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libass9 python3-pil libmpv2 ffmpeg
          # The harness links the runtime ABI. Only the public client header is
          # needed from the dev package, not its full multimedia SDK dependency tree.
          mkdir -p /tmp/nx-mpv-dev /tmp/nx-mpv-headers
          cd /tmp/nx-mpv-dev
          apt-get download libmpv-dev
          dpkg-deb -x libmpv-dev*.deb /tmp/nx-mpv-headers
      - name: Language and video-surface regressions
        run: |
          c++ -std=c++17 -Itests/stubs -Iapp tests/subtitle_config.cpp app/config.cpp app/subtitle_selection.cpp -o /tmp/subtitle-test
          /tmp/subtitle-test
          c++ -std=c++17 -Wall -Wextra -Werror -Iapp tests/media_source.cpp app/media_source.cpp app/json.cpp -o /tmp/media-source-test
          /tmp/media-source-test
          NX_MPV_TEST_FLAGS="-I/tmp/nx-mpv-headers/usr/include -l:libmpv.so.2" python3 tests/http_playback.py
          NX_MPV_TEST_FLAGS="-I/tmp/nx-mpv-headers/usr/include -l:libmpv.so.2" python3 tests/subtitle_selection.py
          c++ -shared -fPIC -std=c++17 -Iapp -Ilibrary/borealis/library/include/borealis/extern tests/video_surface_harness.cpp app/video_surface.cpp library/borealis/library/lib/extern/glad/glad.c -ldl -o /tmp/nx-video-surface.so
          python3 tests/video_surface_stress.py
          /usr/bin/python3 tests/render_subtitles.py
  switch:
    needs: host-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Build and package NRO
        run: bash scripts/package-release.sh /tmp/nx-build
      - uses: actions/upload-artifact@v4
        with:
          name: NX-torrent-player
          path: |
            dist/*.nro
            dist/*.zip
            dist/SHA256SUMS
            dist/DejaVu-LICENSE.txt
            dist/LiberationSans-LICENSE.txt
            dist/FFmpeg-COPYING.GPLv3.txt
            dist/BUILDINFO.txt
      - name: Publish versioned update assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.nro
            dist/*.zip
            dist/SHA256SUMS
            dist/DejaVu-LICENSE.txt
            dist/LiberationSans-LICENSE.txt
            dist/FFmpeg-COPYING.GPLv3.txt
            dist/BUILDINFO.txt
          fail_on_unmatched_files: true
